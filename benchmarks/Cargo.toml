[package]
name = "portage-bench"
version = "0.1.0"
edition = "2024"
# Unpublishable: benchmark-only crate that depends on pkgcraft via git.
publish = false
rust-version.workspace = true

[features]
lasso = [
    "portage-atom/lasso",
    "portage-metadata/lasso",
    "portage-atom-pubgrub/lasso",
    "portage-atom-resolvo/lasso",
    "portage-repo/lasso",
]
symbol-table = [
    "portage-atom/symbol-table",
    "portage-metadata/symbol-table",
    "portage-atom-pubgrub/symbol-table",
    "portage-atom-resolvo/symbol-table",
    "portage-repo/symbol-table",
]
mimalloc = ["dep:mimalloc"]
dhat-heap = ["dep:dhat"]
# Off by default: pkgcraft pulls in gix (a sizeable compile) purely for
# comparison benchmarks against our own parsers/resolver. Most workspace
# work (including anything touching portage-cli itself) never needs these
# comparisons, so keep the default `cargo build`/`check` over this crate
# lean and opt in explicitly when you actually want the pkgcraft numbers.
pkgcraft-compare = ["dep:pkgcraft"]

[dependencies]
gentoo-core = { workspace = true }
portage-atom = { workspace = true }
portage-metadata = { workspace = true }
portage-repo = { workspace = true }
portage-resolve = { workspace = true }
portage-atom-pubgrub = { workspace = true }
portage-atom-resolvo = { workspace = true }

pubgrub = { workspace = true }
resolvo = { workspace = true }
# Pinned so CI (no sibling pkgcraft worktree) can resolve it; local
# benchmarking overrides this to the worktree via .cargo/config.toml.
# Optional — see the `pkgcraft-compare` feature above.
pkgcraft = { workspace = true, optional = true }
clap = { workspace = true }
camino = { workspace = true }
mimalloc = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
flume = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[[bench]]
name = "dep_parsing"
harness = false

[[bench]]
name = "dep_parsing_pkgcraft"
harness = false
required-features = ["pkgcraft-compare"]

[[bench]]
name = "realworld_dep_parsing"
harness = false
required-features = ["pkgcraft-compare"]

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "dedup"
harness = false

[[bench]]
name = "repo_load"
harness = false

[[bench]]
name = "avail_lookup"
harness = false

[[bench]]
name = "trim_scaling"
harness = false

[[bench]]
name = "graph_scaling"
harness = false

[[bench]]
name = "vdb_snapshot"
harness = false

[[bench]]
name = "policy_facts"
harness = false

[[bench]]
name = "policy_lists"
harness = false

[[bench]]
name = "repo_cache_lookup"
harness = false

[[bench]]
name = "provider_postprocess"
harness = false

[[bench]]
name = "source_reuse"
harness = false

[[bench]]
name = "eclass_memo"
harness = false

[[bench]]
name = "regen_reads"
harness = false

[[bench]]
name = "metadata_serialize"
harness = false
