[package]
name = "portage-binpkg"
version = "0.2.1"
edition = "2024"
authors = ["Luca Barbato <lu_zero@gentoo.org>"]
license = "MIT"
description = "Gentoo binary package (GPKG) reading and writing"
readme = "README.md"
keywords = ["gentoo", "portage", "binpkg", "gpkg"]
rust-version.workspace = true
repository.workspace = true
categories = ["development-tools", "filesystem"]
exclude = ["Cargo.lock"]

[dependencies]
sha2 = { workspace = true }
sha1 = { workspace = true }
blake2 = { workspace = true }
md5 = { workspace = true }
hex = { workspace = true }
camino = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
sokgi = "0.3"
pgp = "0.20.0"
# pgp 0.20 still requires rand 0.8; do not bump until pgp does.
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
