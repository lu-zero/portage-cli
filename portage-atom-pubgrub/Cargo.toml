[package]
name = "portage-atom-pubgrub"
version = "0.8.0"
edition = "2024"
authors = ["Luca Barbato <lu_zero@gentoo.org>"]
license = "MIT"
description = "Bridge between portage-atom and the PubGrub dependency solver"
keywords = ["gentoo", "portage", "pubgrub", "dependency", "solver"]
rust-version.workspace = true
repository.workspace = true
categories = ["algorithms", "development-tools"]
exclude = ["AGENTS.md", "docs", "Cargo.lock"]

[features]
lasso = ["portage-atom/lasso", "portage-solver/lasso"]
symbol-table = ["portage-atom/symbol-table", "portage-solver/symbol-table"]

[dependencies]
portage-atom = { workspace = true }
portage-solver = { workspace = true }
pubgrub = { workspace = true }
version-ranges = { workspace = true }
thiserror = { workspace = true }

# Explicit names (not the file-stem default) so the compiled example
# binaries don't collide with portage-atom-resolvo's own examples/resolve.rs
# / examples/resolve_conflicts.rs in the shared target/debug/examples/ dir
# ("output filename collision" warning building --workspace --examples).
# File paths/names are unchanged -- READMEs that reference
# `examples/resolve.rs` by path are still accurate.
[[example]]
name = "pubgrub_resolve"
path = "examples/resolve.rs"

[[example]]
name = "pubgrub_resolve_conflicts"
path = "examples/resolve_conflicts.rs"
