[workspace]
resolver = "3"
members = [
    "portage-cli",
    "gentoo-interner",
    "gentoo-core",
    "portage-atom",
    "portage-metadata",
    "portage-atom-pubgrub",
    "portage-atom-resolvo",
    "portage-solver",
    "portage-resolve",
    "portage-repo",
    "portage-distfiles",
    "portage-vdb",
    "portage-binpkg",
    "gentoo-stages",
    "benchmarks",
]

[workspace.package]
rust-version = "1.95"
repository = "https://github.com/lu-zero/portage-cli"

[workspace.dependencies]
# Workspace members (path + version for publishable crates)
gentoo-interner = { version = "0.4.0", path = "gentoo-interner" }
gentoo-core = { version = "0.6.0", path = "gentoo-core" }
gentoo-stages = { version = "0.6.0", path = "gentoo-stages" }
portage-atom = { version = "0.11.0", path = "portage-atom" }
portage-metadata = { version = "0.9.0", path = "portage-metadata" }
portage-solver = { version = "0.2.0", path = "portage-solver" }
portage-atom-pubgrub = { version = "0.7.0", path = "portage-atom-pubgrub" }
portage-atom-resolvo = { version = "0.8.0", path = "portage-atom-resolvo" }
portage-repo = { path = "portage-repo" }
portage-distfiles = { path = "portage-distfiles" }
portage-vdb = { version = "0.2.0", path = "portage-vdb" }
# portage-resolve: published once as an empty v0.0.1 placeholder to reserve
# the name; unpublishable from here on (depends on portage-repo, below).
portage-resolve = { path = "portage-resolve" }
portage-binpkg = { version = "0.2.0", path = "portage-binpkg" }

# Shared external dependencies
anyhow = "1"
bon = "3"
camino = "1"
colorchoice-clap = "1"
cfg-if = "1.0.4"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.8"
lasso = { version = "0.7", features = ["multi-threaded"] }
mimalloc = "0.1.52"
parking_lot = "0.12"
papaya = "0.2"
pubgrub = "0.4"
resolvo = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
smallvec = "1"
smol_str = "0.3"
toml = "0.8"
symbol_table = { version = "0.5", features = ["global"] }
tempfile = "3"
thiserror = "2"
# Matches the version brush-parser (already in this workspace's dependency
# graph) pins, so this doesn't pull in a second miette version to resolve.
miette = { version = "7.6.0", default-features = false, features = ["derive", "fancy"] }
# Same line as pkgcraft (already in the graph via portage-bench); used by
# `em sync` for git clone/fetch without shelling the network path through git.
# default-features off so we don't pull the whole extras set; keep the
# performance bundle (parallel pack, caches) + zlib-rs — without those, fetch
# "read pack" looks hung even in --release. Always optimised under profile.dev
# (see [profile.dev.package."*"] below).
gix = { version = "0.86.0", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "revision",
    "sha1",
    "sha256",
    "comfort",
    "progress-tree",
    # gix 0.86 always uses zlib-rs; the old `zlib-rs` feature flag was removed.
    "max-performance-safe",
    # `status` (pulls `dirwalk`) backs the two guards `em sync`'s gix backend
    # needs: `Repository::is_dirty` (refuse to clobber a volatile repo's
    # uncommitted work) and `Repository::dirwalk_iter` (the `git clean -d -x`
    # equivalent before a non-volatile hard reset).
    "status",
] }
# Sync progress UI: poll prodash tree → indicatif (default).
indicatif = "0.18"
# NestedProgress tree always (gix-compatible counters). Line renderer features
# are enabled by portage-cli feature `rich` only.
prodash = { version = "31", default-features = false, features = ["progress-tree"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
winnow = { version = "1.0", features = ["ascii"] }
bzip2 = "0.6"
flate2 = "1"
md5 = "0.8"
memmap2 = "0.9"
httpdate = "1"
url = "2"
humansize = "2"
humantime = "2"
rustix = { version = "1", features = ["event", "fs", "process", "pty", "termios"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
anstream = "1"
anstyle = "1"
# Already in the tree via clap_builder; taken directly so output can wrap to the
# real terminal rather than a guess.
terminal_size = "0.4"
# 0.11 still pre-release; pin tip RC until stable ships. 0.10 is the last stable.
blake2 = "0.11.0-rc.6"
boxcar = "0.2"
brush-builtins = { git = "https://github.com/lu-zero/brush.git", rev = "09fa1325" }
brush-core = { git = "https://github.com/lu-zero/brush.git", rev = "09fa1325" }
brush-parser = { git = "https://github.com/lu-zero/brush.git", rev = "09fa1325" }
dhat = "0.3.3"
# Fork: bad-path mknod/chown/chmod pass through to the kernel instead of aborting
# the supervised tree (autoconf probes hit this). PR pending upstream koca-build.
fakeroost = { git = "https://github.com/lu-zero/fakeroost.git", rev = "3f2539f" }
# LD_PRELOAD sibling of fakeroost (same FakerootCommandExt API), for --privilege pseudoroot.
pseudoroot = { git = "https://github.com/lu-zero/pseudoroot.git", tag = "v0.2.1" }
flume = "0.12.0"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
hakoniwa = { git = "https://github.com/lu-zero/hakoniwa.git", rev = "5f77bb1" }
object = "0.40"
itertools = "0.15.0"
jwalk = "0.9"
ldconfig = "0.1.1"
pkgcraft = { git = "https://github.com/pkgcraft/pkgcraft.git", rev = "b9fb45eb1995a6b9750f21312cda5e95bfbbe1bb" }
regex = "1"
roxmltree = "0.21.1"
sha2 = "0.11"
sha1 = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
version-ranges = "0.1"

[profile.release]
opt-level = 3
lto = true

[profile.profiling]
inherits = "release"
debug = 1
lto = false

# Workspace crates stay opt-level 0 for fast rebuilds; every dependency
# (gix-pack, zlib, reqwest, …) is fully optimised. Plain `cargo build` then
# has usable `em sync` without needing `--release` for the gix stack alone.
# (Cargo book: package."*" = all deps, not workspace members.)
[profile.dev.package."*"]
opt-level = 3
